experiment:
  name: autoencoder_baseline
  seed: 42
  device: auto

dataset:
  name: mvtec
  root: data/raw/mvtec
  category: bottle
  image_size: 256
  batch_size: 8
  num_workers: 0

preprocessing:
  grayscale: false
  gaussian_blur: false
  canny: false
  hist_equalize: false
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

model:
  type: autoencoder
  in_channels: 3
  base_channels: 32
  latent_channels: 256

train:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.00001
  threshold_percentile: 95

outputs:
  checkpoint: outputs/checkpoints/autoencoder.pt
