experiment:
  name: patchcore_baseline
  seed: 42
  device: auto

dataset:
  name: mvtec
  root: data/raw/mvtec
  category: bottle
  image_size: 256
  batch_size: 4
  num_workers: 0

preprocessing:
  grayscale: false
  gaussian_blur: false
  canny: false
  hist_equalize: false
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

model:
  type: patchcore
  backbone: resnet18
  pretrained: true
  max_memory_patches: 50000

train:
  threshold_percentile: 95

outputs:
  checkpoint: outputs/checkpoints/patchcore.pt
